<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Anime Search</title>
</head>
<body>
    <main id="particles-js">
        <div class="logo">
            <h1>Anime <span> Search</span></h1>
            <p>Encontre seus personagens favoritos dos animes</p>
        </div>
        
        <form id="searchForm">
        <input type="search" class="btnGradient" id="searchInput" placeholder="Digite o nome do personagem...">
        <input type="submit" class="btnGradient" id="searchButton" value="Buscar">
        </form>

        <p id="message" aria-live="polite"></p>

        <div id="resultados">

        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
