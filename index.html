<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="/images/icone.png" type="image/x-icon">
    <title>Anime Search</title>
</head>

<body>
    <div id="particles-js"></div>
    <main>
            <div class="logo">
                <h1>Anime <span> Search</span></h1>
                <p>Encontre seus personagens favoritos dos animes</p>
            </div>

            <form id="searchForm">
                <input type="search" class="btnGradient" id="searchInput" placeholder="Digite o nome do personagem...">
                <input type="submit" class="btnGradient" id="searchButton" value="Buscar">
            </form>

            <p id="message" aria-live="polite"></p>

            <div id="resultados">

            </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    <script src="app.js"></script>
    <script src="script.js"></script>

</body>

</html>
